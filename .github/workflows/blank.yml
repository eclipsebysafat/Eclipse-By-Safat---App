name: Build Android Web Output
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: App-Web-Build
          path: dist/
          
